        -webkit-font-smoothing: antialiased;
      }
      /* Clean Digital Grid */
      .bg-grid {
        background-image: 
          linear-gradient(to right, rgba(var(--brand-accent-rgb, 212, 255, 0), 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(var(--brand-accent-rgb, 212, 255, 0), 0.05) 1px, transparent 1px);

      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #111111;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--brand-accent);
      }
      ::selection {
        background-color: var(--brand-accent);
        color: #000000;
      }
      canvas {
        display: block;
      }
